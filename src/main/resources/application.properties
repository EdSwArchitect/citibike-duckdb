citibike.csv.resource-pattern=*.csv
citibike.csv.fail-on-empty=true
citibike.csv.fail-on-duplicate-ride-id=true
citibike.jdbc.query-timeout=2s
citibike.jdbc.acquire-timeout=500ms
citibike.jdbc.max-connections=4
citibike.duckdb.threads=4
citibike.duckdb.memory-limit=512MB
citibike.api.max-date-range-days=366
citibike.api.max-page-size=100
citibike.api.max-offset=10000

quarkus.log.level=INFO
quarkus.log.category."com.bscllc.learning.citibike".level=DEBUG
quarkus.micrometer.binder.http-server.enabled=true
quarkus.smallrye-health.root-path=/q/health

# Download-only component: opt in; downloaded archives never enter the CSV loader.
citibike.download.enabled=false
citibike.download.data-directory=./data/citibike-downloads
citibike.download.schedule=0 0 4 * * ?
citibike.download.time-zone=America/New_York
citibike.download.check-on-startup=true

# Production uses a durable database; demo/development and tests retain bundled CSVs.
citibike.storage.mode=file
citibike.storage.data-directory=./data/citibike
citibike.storage.database-path=citibike.duckdb
citibike.storage.bootstrap-bundled=false
citibike.duckdb.max-temp-directory-size=8GB
%dev.citibike.storage.mode=memory
%test.citibike.storage.mode=memory
%dev.citibike.ingestion.enabled=false
%test.citibike.ingestion.enabled=false
%test.citibike.duckdb.max-temp-directory-size=512MB
citibike.ingestion.enabled=true
citibike.ingestion.admin-enabled=false
quarkus.http.auth.basic=true
# Compile the local Basic identity provider with no configured users.
# Credentials and roles are supplied by deployment configuration, never bundled.
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true

%dev.citibike.duckdb.max-temp-directory-size=512MB
